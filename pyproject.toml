[project]
name = "stabar"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.ruff]
# 行长放宽到 100:现有代码最长 90 列,不必为了格式去改既有换行
line-length = 100

[tool.ruff.lint]
# 在 ruff 默认规则之上追加(用 extend 而不是 select,避免顶掉默认规则集):
#   I = import 排序, N = 命名规范
extend-select = ["I", "N"]

[tool.ruff.lint.pep8-naming]
# 这些名字是外部 API 的约定,必须逐字对齐,不能改成 snake_case:
#   paintEvent 等 = Qt 的重写方法,改名就不再是重写、会静默失效;
#   winreg 的五个入口 = tests 里的替身要和真实模块同名才能被注入。
# 集中在这里豁免,不要用行内 noqa;新增同类名字就补进列表。
extend-ignore-names = [
    "paintEvent",
    "enterEvent",
    "leaveEvent",
    "mousePressEvent",
    "mouseMoveEvent",
    "mouseReleaseEvent",
    "contextMenuEvent",
    "eventFilter",
    "CreateKeyEx",
    "OpenKey",
    "QueryValueEx",
    "SetValueEx",
    "DeleteValue",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
